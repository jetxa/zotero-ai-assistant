<linkset>
  <html:link rel="localization" href="ai-assistant-preferences.ftl" />
</linkset>
<groupbox>
  <label>
    <html:h2 data-l10n-id="ai-assistant-pref-title"></html:h2>
  </label>
  <checkbox id="zotero-prefpane-ai-assistant-enable" preference="extensions.zotero.aiassistant.enable"
    data-l10n-id="ai-assistant-pref-enable" />

  <separator class="thin" />

  <hbox align="center">
    <html:label style="width: 150px;">API URL:</html:label>
    <html:input type="text" id="zotero-prefpane-ai-assistant-apiUrl" preference="extensions.zotero.aiassistant.apiUrl"
      flex="1"></html:input>
  </hbox>

  <separator class="thin" />

  <hbox align="center">
    <html:label style="width: 150px;">API Key:</html:label>
    <html:input type="password" id="zotero-prefpane-ai-assistant-apiKey"
      preference="extensions.zotero.aiassistant.apiKey" flex="1"></html:input>
  </hbox>

  <separator class="thin" />

  <hbox align="center">
    <html:label style="width: 150px;">Model:</html:label>
    <html:input type="text" id="zotero-prefpane-ai-assistant-model" preference="extensions.zotero.aiassistant.model"
      flex="1"></html:input>
  </hbox>

  <separator class="thin" />

  <hbox align="center">
    <html:label style="width: 150px;" data-l10n-id="ai-assistant-pref-prompt-translate">Translate Prompt:</html:label>
    <html:textarea id="zotero-prefpane-ai-assistant-promptTranslate"
      preference="extensions.zotero.aiassistant.promptTranslate" rows="3" flex="1"
      placeholder="Please translate the following text into Chinese:"></html:textarea>
  </hbox>

  <separator class="thin" />

  <hbox align="center">
    <html:label style="width: 150px;" data-l10n-id="ai-assistant-pref-prompt-explain">Explain Prompt:</html:label>
    <html:textarea id="zotero-prefpane-ai-assistant-promptExplain"
      preference="extensions.zotero.aiassistant.promptExplain" rows="3" flex="1"
      placeholder="Please explain the following text:"></html:textarea>
  </hbox>

  <separator class="thin" />

  <hbox align="center">
    <html:label style="width: 150px;" data-l10n-id="ai-assistant-pref-fullTextLimit">Full Text Limit:</html:label>
    <html:input type="number" id="zotero-prefpane-ai-assistant-fullTextLimit"
      preference="extensions.zotero.aiassistant.fullTextLimit" style="width: 150px;"></html:input>
  </hbox>

</groupbox>
<vbox>
  <html:label data-l10n-id="ai-assistant-pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'></html:label>
</vbox>
